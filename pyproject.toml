[project]
name = "personal-knowledge-base-os"
version = "1.0.0"
description = "Local knowledge-base API with backlinks and citation-grounded chat."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "build>=1.2.0",
    "alembic>=1.13.0",
]
postgres = ["psycopg[binary]>=3.1.0", "pgvector>=0.2.0"]
redis = ["redis>=5.0.0"]
worker = ["celery>=5.3.0", "redis>=5.0.0"]
providers = ["httpx>=0.24.0", "openai>=1.0.0", "anthropic>=0.30.0"]
parsers = ["pypdf>=4.0.0", "python-docx>=1.1.0", "beautifulsoup4>=4.12.0"]
embeddings = ["numpy>=1.24.0", "sentence-transformers>=3.0.0"]
watcher = ["watchdog>=4.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.api.src*"]
namespaces = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
